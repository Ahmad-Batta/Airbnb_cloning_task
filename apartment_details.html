<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airbnb</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-fluid text-center px-4 py-2 bg-light">
      <div class="row align-items-center">
        <div class="col-4 text-start">
          <div class="d-flex align-items-center">
            <i class="fa-brands fa-airbnb text-danger fs-2"></i>
            <h6 class="text-danger p-1 m-0 fw-bold">airbnb</h6>
          </div>
        </div>

        <div class="col-4">
          <div class="d-flex align-items-center justify-content-center gap-2">
            <a href="#" class="text-decoration-none">
              <i class="fa-solid fa-globe fs-3 text-warning"></i>
            </a>
            <a href="#" class="text-decoration-none">
              <h6 class="py-1 m-0 text-dark">All</h6>
            </a>
            <a href="#" class="text-decoration-none">
              <i class="fa-solid fa-house fs-3 ms-4 text-primary"></i>
            </a>
            <a href="#" class="text-decoration-none">
              <h6 class="py-1 m-0 text-dark">Homes</h6>
            </a>
            <a href="#" class="text-decoration-none">
              <i class="fa-regular fa-paper-plane fs-3 ms-4 text-primary"></i>
            </a>
            <a href="#" class="text-decoration-none">
              <h6 class="py-1 m-0 text-dark">Experiances</h6>
            </a>
            <a href="#" class="text-decoration-none">
              <i class="fa-solid fa-bell fs-3 ms-4 text-primary"></i>
            </a>
            <a href="#" class="text-decoration-none">
              <h6 class="py-1 m-0 text-dark">survices</h6>
            </a>
          </div>
        </div>

        <div class="col-4 text-end">
          <div class="d-flex align-items-center justify-content-end gap-3">
            <h6 class="py-1 m-0 text-dark">Log in or sign Up</h6>
            <div class="d-flex align-items-center gap-2">
              <a
                href="#"
                class="text-decoration-none d-flex align-items-center justify-content-center rounded-circle bg-light border"
                style="width: 40px; height: 40px"
              >
                <i class="fa-solid fa-globe fs-5 text-secondary"></i>
              </a>
              <a
                href="#"
                class="text-decoration-none d-flex align-items-center justify-content-center rounded-circle bg-light border"
                style="width: 40px; height: 40px"
              >
                <i class="fa-solid fa-bars fs-5 text-secondary"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row align-items-center py-5 px-5">
      <div class="col text-start">
        <h2 class="m-0">The Guest Room</h2>
      </div>

      <div class="col-auto">
        <div class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2" style="cursor: pointer">
            <i class="fa-solid fa-share-from-square fs-5"></i>
            <h5 class="m-0" style="font-size: 16px">Share</h5>
          </div>
          <div class="d-flex align-items-center gap-2" style="cursor: pointer">
            <i class="fa-regular fa-heart fs-5"></i>
            <h5 class="m-0" style="font-size: 16px">Save</h5>
          </div>
        </div>
      </div>
    </div>

    <div class="container py-2">
      <div class="row g-2">
        
        <div class="col-md-6">
          <img
            src="images/modern-studio-apartment-design-with-bedroom-living-space.jpg"
            class="img-fluid rounded-start-4 w-100 h-100 object-fit-cover"
            style="min-height: 400px"
            alt="Apartment View 1"
          />
        </div>

        
        <div class="col-md-6">
          <div class="row g-2 h-100">
            <div class="col-6">
              <img
                src="images/3d-rendering-modern-dining-room-living-room-with-luxury-decor.jpg"
                class="img-fluid w-100 h-100 object-fit-cover"
                style="height: 195px"
                alt="Apartment View 2"
              />
            </div>

            <div class="col-6">
              <img
                src="images/3d-rendering-white-wood-living-room-near-bedroom-upstair.jpg"
                class="img-fluid rounded-end-top w-100 h-100 object-fit-cover"
                style="height: 195px; border-radius: 0 15px 0 0"
                alt="Apartment View 3"
              />
            </div>

            <div class="col-6">
              <img
                src="images/cozy-dining-room-modern-apartment.jpg"
                class="img-fluid w-100 h-100 object-fit-cover"
                style="height: 195px"
                alt="Apartment View 4"
              />
            </div>

            <div class="col-6">
              <img
                src="images/luxury-modern-apartment-with-comfortable-pillow-decor-generated-by-ai.jpg"
                class="img-fluid rounded-end-bottom w-100 h-100 object-fit-cover"
                style="height: 195px; border-radius: 0 0 15px 0"
                alt="Apartment View 5"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container text-center pt-4">
      <div class="row">
        <div class="col-md-7">
          <div
            class="row d-flex text-start justify-content-between align-items-center"
          >
            <h2>Entire rental unit in Amman-Jordan</h2>
            <h5 class="text-secondary">
              7 guests . 3 bedrooms . 5 beds . 2.5 baths
            </h5>
          </div>
          <div class="row">
            <div
              class="rounded-1 bg-white px-3 py-1 text-center"
              style="
                left: 10px;
                top: 10px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                font-size: 12px;
                font-weight: 600;
                z-index: 2;
              "
            ></div>
          </div>
        </div>

        <div class="col-md-4 d-flex justify-content-end">
          <div
            class="card "
            style="width: 22rem; height: auto; margin: 0 0 30px 80px"
          >
            <div class="card-body">
              <h5 class="card-title text-start">
                <del class="text-secondary">JD 218</del> JD 192 for 2 nights
              </h5>

              <div class="card rounded-4 border m-3" style="width: 13rem; height : 8rem">
                
                <div class="row g-0 border-bottom ">
                 
                  <div class="col-6 p-2 border-end">
                    <div
                      class="fw-bold"
                      style="font-size: 10px; letter-spacing: 0.5px"
                    >
                      CHECK-IN
                    </div>
                    <div class="fw-medium" style="font-size: 14px">
                      9/18/2026
                    </div>
                  </div>
               
                  <div class="col-6 p-2">
                    <div
                      class="fw-bold"
                      style="font-size: 10px; letter-spacing: 0.5px"
                    >
                      CHECKOUT
                    </div>
                    <div class="fw-medium" style="font-size: 14px">
                      9/20/2026
                    </div>
                  </div>
                </div>

              
                <div
                  class="p-3 d-flex justify-content-between"
                >
                  <div>
                    <div
                      class="fw-bold"
                      style="font-size: 10px; letter-spacing: 0.5px"
                    >
                      GUESTS
                    </div>
                    <div class="fw-medium" style="font-size: 14px">1 guest</div>
                  </div>
                  <div>
                    <i class="fa-solid fa-chevron-down"></i>
                  </div>
                </div>
              </div>
              <a href="#" class="btn btn-danger mt-3 w-100  rounded-5 ">Reserve</a>
              <h6 class = "mt-3">You won't be charged yet</h6>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
